name: Deploy Netstr

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal
      env:
        ConnectionStrings__NetstrDatabase: ${{ secrets.DATABASE_CONNECTION_STRING }}

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Publish
      run: dotnet publish src/Netstr/Netstr.csproj -c Release -o ./publish
      
    # Add your deployment steps here (Docker, Azure, AWS, etc.)
    - name: Deploy to production
      run: |
        echo "Add your deployment commands here"
        echo "Connection string available as: ${{ secrets.DATABASE_CONNECTION_STRING }}"