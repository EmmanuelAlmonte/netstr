name: Secret Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  appsettings-connection-string-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect hardcoded DB passwords in appsettings
        shell: pwsh
        run: ./scripts/check-no-connection-secrets.ps1
